name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Front et API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 : le serveur utilise le module SQLite intégré (node:sqlite)
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Installer
        run: npm ci

      - name: Construire le front
        run: npm run build

      # Démarre l'API sur une base jetable et rejoue le parcours complet
      - name: Tester l'API
        run: npm run check

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v7

      # On vérifie seulement que l'image se construit : Coolify la construit lui-même au déploiement.
      - name: Construction
        run: docker build -t pitstoppd:ci .
